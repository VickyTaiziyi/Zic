name: apk

# Manual, private-test APK builds: run from the Actions tab, then download
# the artifact from the same page (only collaborators of this — private —
# repository can see or fetch it).
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APKs
        run: |
          flutter build apk --release --dart-define=APP_CHANNEL=github
          flutter build apk --release --split-per-abi --dart-define=APP_CHANNEL=github

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zic-apks
          retention-days: 14
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
