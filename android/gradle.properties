# One daemon, bounded heap: this machine class (16 GB) must not spawn
# Gradle + Kotlin daemons that each claim multi-GB heaps.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Kotlin compiles inside the Gradle daemon JVM instead of a separate
# Kotlin daemon (fewer big JVMs, no incremental-cache handoff crashes).
kotlin.compiler.execution.strategy=in-process
# Windows: incremental-cache close failures (file locks on .tab caches)
# break plugin builds; non-incremental is negligible for this tree size.
kotlin.incremental=false
org.gradle.workers.max=3

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
